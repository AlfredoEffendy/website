<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Alfredo Effendy</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<script>(function(){try{var s=localStorage.getItem('theme');document.documentElement.dataset.theme=s==='dark'||(!s&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}catch(e){}})()</script>
<style>
:root{color-scheme:light;--paper:oklch(98.8% .004 300);--surface:#fff;--ink:oklch(27% .02 300);--muted:oklch(47% .02 300);--line-strong:oklch(27% .05 300/.34);--accent:#4b2e83;--accent-strong:#32006e;--accent-soft:oklch(41% .14 295/.09);--on-accent:#fff;--bar:oklch(74% .085 300);--gold:#85754d;--gold-ink:#6d5f3a;--bad:oklch(50% .19 27);--grid-minor:oklch(41% .14 295/.055);--grid-major:oklch(41% .14 295/.13);--font-body:"Open Sans",system-ui,"Segoe UI",Arial,sans-serif;--font-display:"Encode Sans Condensed","Arial Narrow","Open Sans",sans-serif;--font-math:"Cambria Math","STIX Two Math",Cambria,Georgia,serif;--radius:4px}
:root[data-theme=dark]{color-scheme:dark;--paper:oklch(15.5% .025 300);--surface:oklch(19% .025 300);--ink:oklch(93% .012 300);--muted:oklch(72% .025 300);--line-strong:oklch(100% 0 0/.32);--accent:oklch(80% .1 300);--accent-strong:oklch(87% .07 300);--accent-soft:oklch(78% .1 300/.14);--on-accent:oklch(15.5% .025 300);--bar:oklch(56% .1 300);--gold:oklch(80% .06 90);--gold-ink:oklch(82% .06 90);--bad:oklch(72% .15 27);--grid-minor:oklch(80% .1 300/.06);--grid-major:oklch(80% .1 300/.13)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:1.5rem 1rem;color:var(--ink);font:400 1rem/1.55 var(--font-body);border-top:3px solid #4b2e83;
background:linear-gradient(var(--grid-major) 1px,transparent 1px) 0 0/100% 40px,linear-gradient(90deg,var(--grid-major) 1px,transparent 1px) 0 0/40px 100%,linear-gradient(var(--grid-minor) 1px,transparent 1px) 0 0/100% 8px,linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px) 0 0/8px 100%,var(--paper)}
main{width:min(30rem,100%);display:grid;gap:1rem;padding:1.5rem;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius)}
.cap{font:600 .75rem/1.3 var(--font-display);letter-spacing:.14em;color:var(--gold-ink);margin:0}
h1{font:600 1.75rem/1.15 var(--font-display);margin:0}
p{margin:0;color:var(--muted)}
svg{display:block;width:100%;height:auto;font:italic 15px var(--font-math)}
.mu{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:4 4}
.ci{stroke:var(--bar);stroke-width:2;stroke-linecap:round;fill:var(--bar)}
.ci.miss{stroke:var(--bad);fill:var(--bad)}
.new{animation:ci-in .3s cubic-bezier(0,0,.2,1) both}
@keyframes ci-in{from{opacity:0;transform:translateY(8px)}}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.btn{display:inline-flex;align-items:center;min-height:2.75rem;padding:0 1rem;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);color:inherit;font:600 .875rem var(--font-body);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
output{margin-left:auto;font:600 .875rem var(--font-display);font-variant-numeric:tabular-nums;color:var(--muted)}
[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.new{animation:none}}
</style>
</head>
<body>
<main>
<p class="cap">404</p>
<h1>This interval missed the page.</h1>
<svg viewBox="0 0 320 132" role="img" aria-label="Confidence intervals around the page; the latest one misses it.">
<path class="mu" d="M160 18V128"/>
<text x="160" y="12" text-anchor="middle" fill="var(--gold-ink)">μ</text>
<g id="cis">
<g class="ci" transform="translate(0 28)"><path d="M96 0H206"/><circle cx="151" r="3.5"/></g>
<g class="ci" transform="translate(0 44)"><path d="M131 0H241"/><circle cx="186" r="3.5"/></g>
<g class="ci" transform="translate(0 60)"><path d="M85 0H195"/><circle cx="140" r="3.5"/></g>
<g class="ci" transform="translate(0 76)"><path d="M112 0H222"/><circle cx="167" r="3.5"/></g>
<g class="ci" transform="translate(0 92)"><path d="M70 0H180"/><circle cx="125" r="3.5"/></g>
<g class="ci miss" transform="translate(0 108)"><path d="M178 0H288"/><circle cx="233" r="3.5"/></g>
</g>
</svg>
<p>A 95% interval misses 1 time in 20.</p>
<div class="row">
<a class="btn primary" id="home" href="/">Home</a>
<button class="btn" id="again" type="button" hidden>Resample</button>
<output id="tally" aria-label="Intervals that captured the page"></output>
</div>
</main>
<script>
(function () {
  if (/.github.io$/.test(location.hostname)) document.getElementById('home').href = '/' + location.pathname.split('/')[1] + '/';
  var g = document.getElementById('cis'), out = document.getElementById('tally'), btn = document.getElementById('again');
  var xs = [151, 186, 140, 167, 125, 233], n = 6, hits = 5, MU = 160, SE = 28, HALF = 55; // HALF = 1.96 x SE
  function z() { return Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random()); }
  function show() { out.textContent = hits + ' / ' + n; }
  btn.hidden = false; show();
  btn.addEventListener('click', function () {
    var x = Math.max(60, Math.min(260, Math.round(MU + z() * SE)));
    xs.push(x); xs.shift(); n++; if (Math.abs(x - MU) <= HALF) hits++;
    g.innerHTML = xs.map(function (c, i) {
      return '<g class="ci' + (Math.abs(c - MU) > HALF ? ' miss' : '') + '" transform="translate(0 ' + (28 + i * 16) + ')"><g' + (i === 5 ? ' class="new"' : '') +
        '><path d="M' + (c - HALF) + ' 0H' + (c + HALF) + '"/><circle cx="' + c + '" r="3.5"/></g></g>';
    }).join('');
    show();
  });
})();
</script>
</body>
</html>
